<html lang="en">

    <head>
        <title>I am Bored</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
        <link href="style/styles.css" rel="stylesheet">
    </head>

    <body>
        <div class="container">

            <div class="row">
                <div class="col-lg-2"></div>
                <div class="col-lg-8">
                    <br>
                    <span id="alert-box" class="d-none">
                    <div class="alert alert-warning" role="alert">
                        <strong>Please enter a number greater than 0.</strong>
                        
                    </div></span>
                    <br>
                    <div class="progress" id="progress"></div>
                    <br>
                    <form id="form-activity">
                        <div class="form-group">
                            <div class="row">
                                <div class="col-lg-12">
                                    <label for="total-suggestions">How bored are you? Tell me how many suggestions you
                                        need:</label>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-lg-12">
                                    <input id="total-suggestions" class="form-control" type="number">
                                </div>
                            </div>
                        
                                <input type="submit" class="btn btn-primary float-end" value="Generate">
                           
                        </div>

                     


                    </form>
                    <div id="div-activities">
                        <table class="table">
                            <thead class="bg-primary text-white">
                                <tr>
                                    <th scope="col">Index</th>
                                    <th scope="col">Activity</th>
                                    <th scope="col">Type</th>
                                    <th scope="col">Participants</th>
                                    <th scope="col">Price</th>
                                </tr>
                            </thead>
                            <tbody id="activities-table-body"></tbody>
                        </table>
                    </div>
                </div>
                <div class="col-lg-2"></div>
            </div>
        </div>

        <script src="src/progressbar.js"></script>
        <script src="src/Bored.js" type="text/javascript"></script>
    </body>

</html>
